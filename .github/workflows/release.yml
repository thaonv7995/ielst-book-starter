name: Release & Standalone Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Frontend Bundle
        run: npm run build

      - name: Package Standalone Production Archive
        run: |
          echo "📦 Packaging Standalone Production Archive..."
          tar -czf ielst-book-starter-standalone.tar.gz \
            dist \
            server.js \
            ecosystem.config.cjs \
            package.json \
            package-lock.json \
            README.md \
            install.sh

          sha256sum ielst-book-starter-standalone.tar.gz > ielst-book-starter-standalone.tar.gz.sha256
          ls -lh ielst-book-starter-standalone.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            ielst-book-starter-standalone.tar.gz
            ielst-book-starter-standalone.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
